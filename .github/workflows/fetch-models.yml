name: Fetch Model Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: fetch-models
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build data package
        run: pnpm --filter modelpedia build

      # A fetch script that exists but is never invoked drifts with no signal:
      # the fail-loud guards only fire on a run.
      - name: Check every fetch script is wired into this workflow
        working-directory: packages/data
        run: bun scripts/check-coverage.ts

      - name: Fetch all providers
        working-directory: packages/data
        run: |
          # Model data is scraped from public docs and pages only. No API keys
          # are configured here on purpose: authenticated endpoints return
          # thinner data than the public docs, so every fetch script must work
          # without a key. fetch:alibaba must precede fetch:qwen, which derives
          # its catalog from alibaba's output.
          scripts=(
            fetch:openai fetch:anthropic fetch:google fetch:mistral
            fetch:deepseek fetch:xai fetch:cohere fetch:zai
            fetch:minimax fetch:alibaba fetch:meta fetch:moonshot
            fetch:cerebras fetch:baseten fetch:openrouter fetch:perplexity
            fetch:azure fetch:groq fetch:nvidia fetch:together
            fetch:fireworks fetch:amazon fetch:vercel fetch:vertex
            fetch:cloudflare-workers-ai fetch:cloudflare-ai-gateway fetch:opencode fetch:ollama fetch:huggingface
            fetch:qwen fetch:xiaomi fetch:novita fetch:bytedance
            fetch:stability fetch:ai21 fetch:voyage fetch:replicate
            fetch:fal fetch:siliconflow fetch:parasail fetch:nebius
            fetch:black-forest-labs fetch:deepinfra fetch:inception fetch:jina
            fetch:recraft fetch:reka fetch:sambanova fetch:stepfun fetch:writer
            fetch:cursor
          )
          failed=()
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            if ! bun run "$script"; then
              echo "::warning::$script failed"
              failed+=("$script")
            fi
            echo "::endgroup::"
          done
          # Surface failures prominently instead of letting a broken scraper go
          # unnoticed. The job stays green so a single broken provider does not
          # block the data PR, but the failures are reported in the run summary
          # and carried into the PR body.
          if [ ${#failed[@]} -gt 0 ]; then
            {
              echo "### ${#failed[@]} fetch script(s) failed"
              echo ""
              for f in "${failed[@]}"; do echo "- \`$f\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${failed[@]}" > "$GITHUB_WORKSPACE/fetch-failures.txt"
          fi

      - name: Regenerate data
        working-directory: packages/data
        run: bun run generate

      # A PR opened with GITHUB_TOKEN does not trigger other workflows, so
      # check.yml never runs on the data PR and nothing downstream validates it:
      # a scraper writing a non-numeric price reached Vercel before anything
      # caught it. Gate here instead, and fail rather than propose bad data.
      - name: Validate generated data
        run: |
          pnpm validate
          pnpm --filter modelpedia lint

      # A scraper pointed at a frozen listing parses the same models forever, so
      # it never trips a guard. Aggregators are the only independent witness.
      # Reported, not enforced: a first party can legitimately trail a reseller.
      - name: Check catalogs against aggregators
        working-directory: packages/data
        continue-on-error: true
        run: bun scripts/check-freshness.ts

      # The zero-parse guard is a cliff detector. This catches the slope: a
      # scraper that still runs while shedding models or dropping a field.
      - name: Check providers against baseline
        working-directory: packages/data
        continue-on-error: true
        run: bun scripts/check-baseline.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet packages/data/providers packages/data/src packages/npm/src; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes and create or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="data/auto-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or reset branch from current HEAD (which is default branch + fetched data)
          git checkout -B "$BRANCH"

          git add packages/data/providers packages/data/src/data.ts packages/npm/src
          git commit -m "data: update model data $(date +%Y-%m-%d)"
          git push origin "$BRANCH" --force

          # Build a short summary: count creates/updates/deletes per provider
          RAW=$(cd packages/data && bun run changes -- HEAD~1 --dry-run 2>&1)
          STATS=$(echo "$RAW" | grep -E '^\s+(created|updated|deleted):' || true)
          PROVIDERS=$(echo "$RAW" | grep -cE '^\s+[+Δ-] ' || true)
          SUMMARY="**${PROVIDERS} model changes** on $(date +%Y-%m-%d)"
          if [ -n "$STATS" ]; then
            SUMMARY="${SUMMARY}"$'\n\n'"$(echo "$STATS" | sed 's/^  /- /')"
          fi

          # Flag any providers whose fetch failed this run so a silent scraper
          # break shows up in the PR rather than passing as a no-op.
          if [ -f "$GITHUB_WORKSPACE/fetch-failures.txt" ]; then
            FAILS=$(sed 's/^/- `/; s/$/`/' "$GITHUB_WORKSPACE/fetch-failures.txt")
            SUMMARY="${SUMMARY}"$'\n\n'"**Fetch failures (need attention):**"$'\n'"${FAILS}"
          fi

          # Create PR if none exists, otherwise update the existing one
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          BODY=$(printf '## Automated model data update\n\n%s\n\n> Auto-created by the fetch-models workflow.\n> Changes will be detected on merge.' "$SUMMARY")
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "data: update model data $(date +%Y-%m-%d)" \
              --body "$BODY"
            echo "Updated PR #$EXISTING_PR"
          else
            gh pr create \
              --title "data: update model data $(date +%Y-%m-%d)" \
              --body "$BODY"
          fi

      # Freshness and scrape health land in Axiom so a stale data PR or a
      # broken provider raises an alert instead of hiding in a green run.
      # dataAgeHours comes from the GitHub API because the checkout is shallow
      # and the branch step above rewrites local history.
      - name: Report pipeline telemetry to Axiom
        if: always()
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -z "$AXIOM_TOKEN" ] && { echo "AXIOM_TOKEN not set; skipping"; exit 0; }
          LAST_DATA_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=packages/data/providers&sha=main&per_page=1" --jq '.[0].commit.committer.date')
          AGE_HOURS=$(( ( $(date +%s) - $(date -d "$LAST_DATA_COMMIT" +%s) ) / 3600 ))
          FAILED_JSON="[]"
          FAILED_COUNT=0
          if [ -f "$GITHUB_WORKSPACE/fetch-failures.txt" ]; then
            FAILED_JSON=$(jq -R . "$GITHUB_WORKSPACE/fetch-failures.txt" | jq -cs .)
            FAILED_COUNT=$(wc -l < "$GITHUB_WORKSPACE/fetch-failures.txt" | tr -d ' ')
          fi
          {
            jq -cn --arg runId "$GITHUB_RUN_ID" --arg status "$JOB_STATUS" \
              --argjson failedProviders "$FAILED_JSON" --argjson failedCount "$FAILED_COUNT" \
              --argjson dataAgeHours "$AGE_HOURS" \
              '{msg:"pipeline.run", runId:$runId, status:$status, failedProviders:$failedProviders, failedCount:$failedCount, dataAgeHours:$dataAgeHours}'
            for f in packages/data/providers/*/_seen.json; do
              p=$(basename "$(dirname "$f")")
              jq -c --arg provider "$p" '{msg:"pipeline.provider", provider:$provider, models:.count, seenDate:.date}' "$f"
            done
          } > /tmp/axiom-events.ndjson
          curl -sf -X POST "https://api.axiom.co/v1/datasets/modelpedia-pipeline/ingest" \
            -H "Authorization: Bearer $AXIOM_TOKEN" \
            -H "Content-Type: application/x-ndjson" \
            --data-binary @/tmp/axiom-events.ndjson > /dev/null \
            || echo "::warning::axiom ingest failed"
